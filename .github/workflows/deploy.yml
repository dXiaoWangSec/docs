# Build and deploy the VitePress site to GitHub Pages
name: Deploy VitePress site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          VITE_GISCUS_REPO: ${{ vars.VITE_GISCUS_REPO || 'dXiaoWangSec/docs' }}
          VITE_GISCUS_REPO_ID: ${{ secrets.VITE_GISCUS_REPO_ID || 'R_kgDOUSh3YA' }}
          VITE_GISCUS_CATEGORY: ${{ vars.VITE_GISCUS_CATEGORY || 'General' }}
          VITE_GISCUS_CATEGORY_ID: ${{ secrets.VITE_GISCUS_CATEGORY_ID || 'DIC_kwDOUSh3YM4DFKYJ' }}
          VITE_GISCUS_MAPPING: pathname
          VITE_GISCUS_STRICT: 0
          VITE_GISCUS_REACTIONS_ENABLED: 1
          VITE_GISCUS_EMIT_METADATA: 0
          VITE_GISCUS_INPUT_POSITION: bottom
          VITE_GISCUS_LANG: zh-CN
          VITE_GISCUS_LOADING: lazy
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
